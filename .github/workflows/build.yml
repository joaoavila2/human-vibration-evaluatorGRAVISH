name: Build

# Gera o executavel do Windows automaticamente. Depois de dar push neste
# repositorio, o .exe aparece em Actions -> build-windows -> Artifacts.
#
# Se o repositorio for publico, o GitHub roda de graca. A pasta data/ tem 35 MB,
# o que cabe folgado no limite de 100 MB por arquivo do Git.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que os dados estao presentes
        shell: bash
        run: |
          test -f data/posture3.npz || { echo "data/ nao foi commitado"; exit 1; }
          ls -la data/

      - name: Compilar
        run: pyinstaller iso2631-5.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: AvaliadorDeVibracaoHumana-windows
          path: dist/AvaliadorDeVibracaoHumana.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: pyinstaller iso2631-5.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: AvaliadorDeVibracaoHumana-linux
          path: dist/AvaliadorDeVibracaoHumana
          retention-days: 30
